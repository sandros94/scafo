# A complete scafo installation on one host: a bucket, one node, and the Caddy
# it routes through.
#
#   docker compose -f examples/compose.yaml up --build -d
#
# Then, from a checkout with the CLI built (`pnpm build`). The key is written to
# ./scafo-operator.json, which is where `deploy` looks for it:
#
#   export SCAFO_S3_ENDPOINT=http://127.0.0.1:8333 SCAFO_S3_BUCKET=scafo \
#          SCAFO_S3_ACCESS_KEY=scafo SCAFO_S3_SECRET_KEY=scafo-secret
#   node dist/cli/index.mjs keygen --register
#   node dist/cli/index.mjs deploy ./my-app --agent http://127.0.0.1:7400 \
#     --project shop --env production --flip
#   curl -H 'Host: shop.scafo.test' http://127.0.0.1
#
# The application answers at `<project>--<env>.scafo.test`, at `shop.scafo.test`
# for the `production` environment, and at `<project>--<build>.scafo.test` for
# every build that is running. Nothing resolves those names on your machine —
# send the `Host` header, or add them to /etc/hosts.
#
# Scaling this to several hosts is a matter of running this same node service on
# each of them against the SAME bucket and prefix, on a network they can all
# reach: see examples/kubernetes/README.md for what that changes. The rule that
# bites first is the same one stated there — more than one node means
# SCAFO_BIND_HOST past loopback — and a scheduler that replicates this service
# counts, Swarm's `deploy.replicas` included: every replica is a node.

services:
  # The registry: every project, build, environment and node record scafo has,
  # as JSON objects mutated only through conditional writes. SeaweedFS is here
  # because it is small and honours those writes; any store that does works just
  # as well, and pointing SCAFO_S3_ENDPOINT at one makes this service
  # unnecessary. The first node to boot proves the bucket honours them before
  # anything is written for real, so a store that does not fails loudly rather
  # than corrupting state later.
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    command: ["server", "-s3"]
    ports:
      # Published so the CLI on your host reaches the same bucket the node does.
      - "127.0.0.1:8333:8333"
    volumes:
      - store:/data

  # Creates the one bucket this installation lives in, then exits. A real
  # installation makes the bucket once, by hand or in its own provisioning.
  #
  # ONE BUCKET AND PREFIX IS ONE FLEET. Two installations sharing them share
  # every record and will fight over the coordinator lease; two that differ in
  # either share nothing at all.
  bucket:
    image: curlimages/curl:latest
    depends_on:
      - seaweedfs
    command:
      - sh
      - -c
      - "until curl -fsS -X PUT http://seaweedfs:8333/scafo; do sleep 1; done"

  # The node: the agent, the celld processes it supervises, and the deploy
  # intake. One of these per machine.
  node:
    build:
      context: ..
      dockerfile: Dockerfile
    image: scafo:local
    depends_on:
      bucket:
        condition: service_completed_successfully
    # THIRTY-FIVE SECONDS, AND NOT DOCKER'S DEFAULT TEN.
    #
    # On SIGTERM the node marks itself as draining so the fleet stops giving it
    # work, releases the coordinator lease, stops reconciling, and only then
    # stops the celld processes serving traffic — each of which drains its
    # in-flight requests for 25s and is given 30s before it is killed. Ten
    # seconds cuts that off in the middle: requests are dropped mid-flight and
    # the fleet has to time the node out rather than being told it left.
    stop_grace_period: 35s
    ports:
      # Caddy shares this container's network namespace, so ITS ports are
      # published here — a container that joins another's namespace has no
      # network of its own to publish from.
      - "80:80"
      # The agent API, on your loopback only: it accepts deploys and commands
      # this node, so it belongs on a network you trust rather than on 0.0.0.0.
      - "127.0.0.1:7400:7400"
    volumes:
      # A node IS its keypair. The id it registers under and the Ed25519 pair
      # that signs for it live in this volume; losing it leaves a stale public
      # key in the registry and every token this node signs rejected for
      # reasons nothing on it explains. Deleting it is a deliberate act.
      - state:/var/lib/scafo
      # OPTIONAL, and only for the two settings below: the file Caddy writes its
      # access log to, shared with the ingress container so the node can read it.
      - ingress-log:/var/log/scafo-ingress
    environment:
      SCAFO_S3_ENDPOINT: ${SCAFO_S3_ENDPOINT:-http://seaweedfs:8333}
      SCAFO_S3_BUCKET: ${SCAFO_S3_BUCKET:-scafo}
      SCAFO_S3_ACCESS_KEY: ${SCAFO_S3_ACCESS_KEY:-scafo}
      SCAFO_S3_SECRET_KEY: ${SCAFO_S3_SECRET_KEY:-scafo-secret}
      # Apex domains this installation serves subdomains under.
      SCAFO_PLATFORM_DOMAINS: scafo.test
      # Bound wide because the port above is published from outside the
      # container; the default is loopback, which nothing could reach.
      SCAFO_LISTEN: 0.0.0.0:7400
      # REQUIRED THE MOMENT ANY ADDRESS LEAVES LOOPBACK, and there is no
      # default. Every address a node exposes carries traffic that commands it,
      # so scafo refuses to boot until the operator says what network that is:
      # `none` states it is already private and trusted — as a single host's own
      # docker network is — and `wireguard` puts it in a tunnel scafo sets up.
      # Answering this wrong is the one mistake this file cannot make for you.
      SCAFO_TRANSPORT: none
      # Where peers should dial this node. A single node's peer is itself, so
      # loopback is honest here; a fleet advertises the address the other nodes
      # actually reach it at.
      SCAFO_ADVERTISE: 127.0.0.1:7400
      # Caddy's admin API, on the loopback the two containers share.
      SCAFO_CADDY_ADMIN: http://127.0.0.1:2019
      # OPTIONAL, AND BOTH LINES GO TOGETHER. The first turns the node's own
      # reporting on; the second says where its ingress writes the access log it
      # should count requests off — the ONLY complete account of what this
      # installation served, since once a process is up its traffic goes
      # ingress → process and never touches the node. Requests, bytes, statuses
      # and latencies are then kept per project and environment, in memory, for
      # as long as this node runs; nothing is persisted or served yet.
      #
      # BRING YOUR OWN INGRESS AND SKIP BOTH. There is no default path and
      # naming none is not a warning: an installation whose Caddy or Traefik is
      # configured elsewhere simply never sets SCAFO_INGRESS_ACCESS_LOG, and the
      # adapter is not built at all. Naming one with SCAFO_OBSERVABILITY off is
      # REFUSED at boot rather than ignored, because nothing would read it.
      #
      # What turns the log on at the other end is in caddy.json: a `scafo` log
      # under `logging.logs` writing this file with the json encoder, and
      # `logs.default_logger_name` on the server pointing the access entries at
      # it. `"mode": "0644"` is what lets the node (uid 10001) read a file Caddy
      # writes as root.
      SCAFO_OBSERVABILITY: "1"
      SCAFO_INGRESS_ACCESS_LOG: /var/log/scafo-ingress/access.log

  # The ingress. It SHARES THE NODE'S NETWORK NAMESPACE, which is the whole
  # topology in one line: the celld processes bind 127.0.0.1 and nothing else,
  # Caddy dials them there, and the node converges Caddy's admin API on the same
  # loopback. Neither ever exposes a runtime port to the network.
  #
  # caddy.json carries no comments because Caddy refuses keys it does not know,
  # so the two things it has to do are here instead:
  #
  #   1. Enable the admin API at 127.0.0.1:2019 — the address a node assumes
  #      when nothing configures one, and the one it PUSHES its routing to after
  #      every reconcile pass. Caddy allows a loopback admin's own origin
  #      implicitly; moving the API past loopback means listing `origins` AND
  #      putting it on a network you trust, since it can rewrite everything.
  #   2. Define a server named `scafo` (the driver's default; change it with
  #      `ingress.serverName`). The node adds and removes routes INSIDE that
  #      server — it does not create it, so an absent one means an ingress
  #      failure on every pass and nothing routed.
  #
  # Routes written into that server by hand are left alone: the node owns only
  # the ones carrying its own `scafo_` id prefix, so this file stays where an
  # operator's own hosts, redirects and TLS policies live.
  caddy:
    image: caddy:2
    network_mode: "service:node"
    depends_on:
      - node
    command: ["caddy", "run", "--config", "/etc/caddy/config.json"]
    volumes:
      - ./caddy.json:/etc/caddy/config.json:ro
      # The same volume the node mounts, which is the whole of how the access
      # log gets from the ingress to the node. Drop it, the `logging` block in
      # caddy.json and the two SCAFO_ settings above together, or keep them
      # together — half of this is a node counting nothing.
      - ingress-log:/var/log/scafo-ingress

volumes:
  store:
  state:
  ingress-log:
