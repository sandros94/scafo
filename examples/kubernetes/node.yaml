# A scafo fleet on Kubernetes: two nodes, each a pod carrying the agent and the
# Traefik that fronts it.
#
# Read examples/kubernetes/README.md before applying this — it covers the apply
# order, how traffic gets in, and the two rules that must not be violated.
#
# Everything below is one fleet because every pod names the same bucket and the
# same prefix. That, and nothing else, is what makes them an installation.
---
# Bucket credentials. Replace these before applying anything; they are the only
# secret in the file, and they carry the whole registry.
apiVersion: v1
kind: Secret
metadata:
  name: scafo-bucket
type: Opaque
stringData:
  SCAFO_S3_ACCESS_KEY: "REPLACE_ME"
  SCAFO_S3_SECRET_KEY: "REPLACE_ME"
---
# Everything else a node reads. None of it is secret and all of it is identical
# across the fleet — what differs per pod is generated by the pod itself.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scafo-node
data:
  SCAFO_S3_ENDPOINT: "http://minio.storage.svc.cluster.local:9000"
  SCAFO_S3_BUCKET: "scafo"
  # The region requests are signed for. Some stores validate it and refuse a
  # request signed for another; the ones that ignore it are unharmed by naming
  # one, so it is set here rather than left to be discovered.
  SCAFO_S3_REGION: "us-east-1"
  # One bucket can hold several fleets, one per prefix. Changing this on a
  # running installation points the nodes at an empty registry.
  SCAFO_S3_PREFIX: "prod"
  SCAFO_PLATFORM_DOMAINS: "apps.example.com"
  # Bound wide because the Traefik in this pod and the readiness probe both
  # reach it, and because peers dial it at the pod IP below. The default is
  # loopback, which none of that could reach.
  SCAFO_LISTEN: "0.0.0.0:7400"
  # WHAT THE RUNTIME PROCESSES BIND, AND A FLEET DOES NOT WORK WITHOUT IT.
  #
  # The default is loopback, which is everything a SINGLE node needs — its own
  # ingress and its own readiness probe are on that loopback. A fleet is the
  # case that needs more: one cell has one owner, and a request landing on a pod
  # that does not own it is forwarded to the pod that does, at the address that
  # pod advertises. With the listeners on loopback nothing answers there, and a
  # request for a durable object owned elsewhere fails outright ("The Durable
  # Object owner is currently unreachable") on whichever pod the load balancer
  # happened to pick.
  #
  # The sidecar keeps dialling 127.0.0.1 — a wildcard answers there too — so
  # nothing about the pod-local topology changes. What does change is that the
  # runtime's peer listener, which authenticates nobody, is now on the pod
  # network: it is exposed on exactly the terms SCAFO_TRANSPORT below classifies,
  # and it is the same decision, not a second one.
  SCAFO_BIND_HOST: "0.0.0.0"
  # THE OPERATOR'S CLASSIFICATION CALL, and there is no default for it.
  #
  # Every address a node exposes carries traffic that commands it, so scafo
  # refuses to boot until it is told what network that is. `none` says the
  # network is already private and trusted. A pod network usually is — it is
  # not reachable from outside the cluster — but "usually" is the operator's
  # judgement to make about THEIR cluster, not scafo's to assume: a shared
  # cluster with no NetworkPolicy between namespaces is a different answer from
  # a dedicated one. Set `wireguard` instead to have scafo tunnel it.
  SCAFO_TRANSPORT: "none"
  # Traefik is PULLED, not pushed: this node renders its routing and serves it
  # at /v1/ingress/traefik, and the sidecar polls that. Nothing here names an
  # address for it, because the node never calls it.
  SCAFO_INGRESS_DRIVER: "traefik"
  # Which of the sidecar's entryPoints the published routers attach to. Named
  # rather than left out: routers with no entryPoints attach to EVERY entryPoint
  # Traefik has, including ones scafo has no business on.
  SCAFO_TRAEFIK_ENTRYPOINTS: "web"
  # OPTIONAL, AND BOTH LINES GO TOGETHER. The first turns the node's own
  # reporting on; the second says where its ingress writes the access log it
  # should count requests off — the ONLY complete account of what this
  # installation served, since once a process is up its traffic goes
  # ingress → process and never touches the node. Requests, bytes, statuses and
  # latencies are then kept per project and environment, in memory, for as long
  # as the pod lives; nothing is persisted or served yet.
  #
  # BRING YOUR OWN INGRESS AND SKIP BOTH. There is no default path and naming
  # none is not a warning: an installation whose ingress is configured elsewhere
  # simply never sets SCAFO_INGRESS_ACCESS_LOG, and the adapter is not built at
  # all. Naming one with SCAFO_OBSERVABILITY off is REFUSED at boot rather than
  # ignored, because nothing would read it.
  #
  # What turns the log on at the other end is the `accessLog` block in the
  # sidecar's static configuration below — `--accesslog.filepath` and
  # `--accesslog.format=json` written as configuration rather than as flags —
  # plus the `ingress-log` volume both containers mount. Both containers run as
  # uid 10001, so an emptyDir needs nothing said about permissions.
  SCAFO_OBSERVABILITY: "1"
  SCAFO_INGRESS_ACCESS_LOG: "/var/log/scafo-ingress/access.log"
---
# The sidecar's static configuration. The `http` provider is the entire
# scafo-facing part of it: what it reads at that URL is the whole of what this
# provider routes, so scafo can neither see nor clobber routers an operator
# supplies from their other providers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: scafo-traefik
data:
  traefik.yml: |
    entryPoints:
      web:
        # Above 1024 so the sidecar needs no capability to bind it; the Service
        # publishes 80 and targets this.
        address: ":8000"
      traefik:
        address: ":8080"

    providers:
      http:
        # SAME POD, SO LOOPBACK. Containers in a pod share a network namespace,
        # which is exactly the topology a single host gets by hand with
        # `network_mode: service:node` — the celld processes bind 127.0.0.1 and
        # nothing else, Traefik dials them there, and it polls the agent on the
        # same loopback. No runtime port is ever exposed to the cluster.
        endpoint: "http://127.0.0.1:7400/v1/ingress/traefik"
        pollInterval: "5s"

    ping:
      entryPoint: traefik

    log:
      level: INFO

    # OPTIONAL, and the other half of SCAFO_INGRESS_ACCESS_LOG above: what the
    # node reads to count what this pod's ingress actually served. `json` is
    # required — the node reads Traefik's structured fields (RequestHost,
    # DownstreamStatus, DownstreamContentSize, Duration), not the common format.
    accessLog:
      filePath: /var/log/scafo-ingress/access.log
      format: json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scafo-node
  labels:
    app.kubernetes.io/name: scafo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: scafo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scafo
    spec:
      # THIRTY-FIVE SECONDS, AND NOT KUBERNETES' DEFAULT THIRTY.
      #
      # On SIGTERM a node writes that it is draining so the coordinator stops
      # giving it work, releases the coordinator lease, stops reconciling,
      # closes its listener, and only then stops the celld processes serving
      # traffic — each of which drains its in-flight requests for 25s and is
      # given 30s before it is killed. Anything shorter cuts the drain off in
      # the middle: requests are dropped mid-flight, and the fleet has to time
      # the node out over the liveness window instead of being told it left.
      terminationGracePeriodSeconds: 35
      securityContext:
        # The uid the image's `scafo` user runs as. The state volume below is
        # handed to this group so the node can write its identity into it.
        fsGroup: 10001
      volumes:
        # NODE IDENTITY IS DISPOSABLE HERE, BY DESIGN.
        #
        # A node is its keypair, and it keeps it across restarts — but "this
        # node" is a thing the registry knows about, not a thing the cluster
        # does. A pod that is replaced comes up, generates a fresh identity,
        # registers it and is given work; the record its predecessor left is
        # counted out after the liveness window and never given any again. The
        # registry in the bucket is the truth, and it survives every pod.
        #
        # So a PersistentVolumeClaim here is OPTIONAL, not required. It buys
        # stable node ids across restarts — steadier rendezvous placement and a
        # registry that does not accumulate inert records — at the cost of a
        # StatefulSet and per-pod storage. An emptyDir is the right default.
        - name: state
          emptyDir: {}
        - name: traefik-config
          configMap:
            name: scafo-traefik
        # OPTIONAL, and only for the access-log settings above: how the log gets
        # from the sidecar that writes it to the node that counts it. It is
        # pod-scoped and disposable by design — the counters are in memory and
        # start from zero with the pod, so a volume that outlives one buys
        # nothing. Drop it, the `accessLog` block and the two SCAFO_ settings
        # together, or keep them together.
        - name: ingress-log
          emptyDir: {}
      containers:
        - name: node
          # Built from the repository's Dockerfile and pushed somewhere the
          # cluster can pull from. Pin a tag you control rather than tracking a
          # moving one: every pod of this Deployment is a node, and a rollout
          # that changes what a node IS should be a decision, not a restart.
          image: scafo:local
          args: ["sail"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          envFrom:
            - secretRef:
                name: scafo-bucket
            - configMapRef:
                name: scafo-node
          env:
            # Where peers dial this node for cell traffic they do not own. It
            # cannot be configured ahead of time and it cannot be a Service
            # name — it has to be THIS pod — so it comes from the downward API.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SCAFO_ADVERTISE
              value: "$(POD_IP):7400"
            # What this machine IS, for `scafo env selector` to target. Node
            # labels are BOOT configuration: registration replaces the record
            # wholesale, so this is the single source of truth for them.
            - name: SCAFO_NODE_LABELS
              value: "platform=kubernetes"
          ports:
            - name: agent
              containerPort: 7400
          volumeMounts:
            - name: state
              mountPath: /var/lib/scafo
            - name: ingress-log
              mountPath: /var/log/scafo-ingress
              readOnly: true
          # Answered before the node is doing anything else useful, and cheap.
          readinessProbe:
            httpGet:
              path: /v1/health
              port: agent
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/health
              port: agent
            periodSeconds: 20
            failureThreshold: 3
          resources:
            # THE MEMORY LIMIT IS PLANNED FROM. THE CORES ARE NOT, UNLESS SAID.
            #
            # The node plans its capacity — how many cells it will hold and what
            # RSS budget it gives them — by reading its own cgroup. A memory
            # limit is what writes `memory.max`, so the 2Gi below really is the
            # number the memory side of that plan is done from, and a pod with
            # none plans against the whole machine's memory.
            #
            # The CPU side is not capped here at all, and A REQUEST IS A SHARE
            # RATHER THAN A CEILING: it writes no `cpu.max`, so every pod reads
            # the host's core count and plans against all of it — on a 2-vCPU
            # machine, two pods each plan for 2 cores. Add `limits.cpu` if the
            # plan should match the slice the pod actually gets; the cost is
            # being throttled at it, which is why this file does not assume it.
            #
            # SIZE THIS AGAINST THE BUCKET'S LATENCY, NOT ONLY THE WORKLOAD. A
            # small node running several runtime processes against a store with
            # a long latency tail can stall inside one of that store's slow
            # spells for longer than the runtime's lease renewal allows: the
            # process fences itself, exits, and is restarted. Serving mostly
            # survives that — it comes back, and the other nodes never stopped
            # answering — but the node churns. Fewer, larger nodes and a bucket
            # close to them is the fix.
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              memory: "2Gi"
        - name: traefik
          # v3 specifically. The routing the node publishes is a v3 dynamic
          # configuration: `HostRegexp` takes a plain Go regular expression
          # there, where v2 takes a named-group pattern of its own. A v2 Traefik
          # loads the same document without complaining and reports the routers
          # as enabled — the ones matching a single host work, and the platform
          # domain's catch-all matches nothing, so a host waiting to be woken is
          # answered 404 by the ingress instead of reaching the node.
          image: traefik:v3
          args: ["--configFile=/etc/traefik/traefik.yml"]
          securityContext:
            # Nothing here needs root: the entryPoint is above 1024, the
            # configuration is a read-only ConfigMap, and the only thing this
            # writes is its own access log into an emptyDir it shares with the
            # node — which both containers run as the same uid for.
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
          ports:
            - name: web
              containerPort: 8000
          volumeMounts:
            - name: traefik-config
              mountPath: /etc/traefik
              readOnly: true
            - name: ingress-log
              mountPath: /var/log/scafo-ingress
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            periodSeconds: 5
---
# Headless: no cluster IP, one DNS A record per ready pod. It is what makes the
# individual nodes addressable — for a peer, for an operator running
# `scafo deploy` from inside the cluster, and for reading one node's /v1/state
# rather than whichever one a load balancer picked.
apiVersion: v1
kind: Service
metadata:
  name: scafo-nodes
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: scafo
  ports:
    - name: agent
      port: 7400
      targetPort: agent
---
# How application traffic gets in: one address in front of every pod's Traefik
# sidecar. Point the wildcard DNS for the platform domain at it — see the README
# for what that means for `--replicas`.
#
# THIS IS THE ONE THING IN THE FILE THAT DEPENDS ON THE CLUSTER, and a
# LoadBalancer is only the simplest of the shapes it takes:
#
#   * A cloud provider's controller gives this an address of its own and it
#     works as written.
#   * An implementation that publishes a LoadBalancer by taking the port on
#     every node — k3s' ServiceLB does, and it is what the bundled ingress
#     controller is already published through — has no port 80 left to give.
#     The Service never gets an address and the pods meant to carry it stay
#     Pending on "didn't have free ports for the requested pod ports", with
#     nothing else in the cluster looking wrong. Either take :80 back (drop the
#     bundled controller) or use the next option.
#   * A cluster that already terminates traffic somewhere — an ingress
#     controller, a Gateway — keeps doing that: make this `type: ClusterIP` and
#     send it every name under the platform domain, Host header intact. What
#     routes a request is the Traefik inside the pod; whatever puts the request
#     in front of it only has to not rewrite the name. The README carries the
#     Ingress that shape is written as.
apiVersion: v1
kind: Service
metadata:
  name: scafo-ingress
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: scafo
  ports:
    - name: http
      port: 80
      targetPort: web
