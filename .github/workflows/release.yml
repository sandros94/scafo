name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: ghcr.io/sandros94/scafo

jobs:
  # Open or update a draft release PR from commits since the last tag.
  pr:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: danielroe/uppt/pr@775bb233d2c5671b2c12d48f822778aae8231376 # v0.6.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Tag a merged release PR and dispatch this workflow at the new tag.
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: danielroe/uppt/release@775bb233d2c5671b2c12d48f822778aae8231376 # v0.6.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Pack the tagged release and upload its tarball.
  pack:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - id: pack
        uses: danielroe/uppt/pack@775bb233d2c5671b2c12d48f822778aae8231376 # v0.6.7

  # Stage the tarball through npm trusted publishing and await approval.
  publish:
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write
    environment: npm
    steps:
      - uses: danielroe/uppt/publish@775bb233d2c5671b2c12d48f822778aae8231376 # v0.6.7
        with:
          files: ${{ needs.pack.outputs.files }}

  # The stable channel: the tagged commit ships as :<version> (and :latest
  # unless the release is a prerelease), with its binaries attached to the
  # GitHub release that uppt/release has already cut by the time this runs.
  tags:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tags: ${{ steps.compute.outputs.tags }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags
        id: compute
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          args=(--image "$IMAGE" --version "$RELEASE_TAG")
          # A prerelease must never move the "latest" pointer.
          if [ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" != "true" ]; then
            args+=(--latest)
          fi
          {
            echo "tags<<TAGS_EOF"
            .github/scripts/image-tags.sh "${args[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  # The permissions are the union of what publish.yml's jobs ask for, because
  # a called workflow may only narrow the caller's grant.
  images:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: tags
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      image-tags: ${{ needs.tags.outputs.image-tags }}
      release-tag: ${{ github.ref_name }}
