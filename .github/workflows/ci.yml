name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # A manual run is the escape hatch for the path gates below: it runs every
  # job, whatever the diff touched, so the container suites stay verifiable
  # against a tree that did not change them.
  workflow_dispatch:

# Jobs opt in to exactly the scopes they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sandros94/scafo

jobs:
  build-image:
    # The node image is built once per run, here, and every consumer downstream
    # takes those exact bits: the container suites load the archive into their
    # own daemon, and the publish path pushes the very manifest the suites ran
    # against. Building per job would test one image and ship another.
    #
    # A push builds whatever the diff touched, because `publish` has no other
    # source for what it ships — on a docs-only push the suites below are
    # skipped and these archives are still what reaches ghcr.
    #
    # Runners are pinned to the newest STABLE image pair rather than riding
    # ubuntu-latest: the amd64 and arm64 legs must move between OS versions
    # together, and -latest migrates only one of them.
    name: build image (${{ matrix.platform }})
    needs: test-pure
    # success() is spelled out because a custom if replaces the implicit one a
    # "needs" would otherwise carry.
    if: >-
      ${{ success() && (needs.test-pure.outputs.docker == 'true' || needs.test-pure.outputs.k3s == 'true' || github.event_name == 'push') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            # Only the architecture the suites run on needs the test host image.
            probe: true
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            probe: false

    steps:
      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # Artifact names cannot contain "/", so linux/amd64 becomes linux-amd64.
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/image"

      - name: Checkout code
        uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the node image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # No inline provenance: BuildKit would turn the archive's single image
          # manifest into an index, and the digest this run publishes is that
          # manifest's. Provenance is attested once, over the merged manifest
          # list, in publish.yml.
          provenance: false
          # An OCI layout rather than a docker archive: it is the only export
          # that carries the manifest digest the registry will store, which is
          # what lets the publish path push these bits without rebuilding them.
          outputs: type=oci,dest=${{ runner.temp }}/image/scafo-${{ env.PLATFORM_PAIR }}.tar

      - name: Build the test host image
        if: matrix.probe
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # The stage the Docker suites bind-mount a worktree's build into; it
          # shares every layer above with the build that just ran.
          target: probe
          provenance: false
          outputs: type=oci,dest=${{ runner.temp }}/image/scafo-probe.tar

      - name: Report the image digest
        env:
          ARCHIVE: ${{ runner.temp }}/image/scafo-${{ env.PLATFORM_PAIR }}.tar
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # The archive carries its own digest, so nothing has to be handed
          # downstream as a job output: whoever opens it reads the same number.
          # Asserting the shape here — one image manifest, not an index — fails
          # a change in what buildx exports at the build and not at the push.
          digest="$(tar -xOf "$ARCHIVE" index.json \
            | jq -r '.manifests | select(length == 1) | .[0].digest')"
          case "$digest" in
            sha256:*) ;;
            *)
              echo "build-image: $ARCHIVE holds no single image manifest" >&2
              exit 1
              ;;
          esac
          echo "$PLATFORM $digest"
          echo "- \`$PLATFORM\` \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the node image
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/image/scafo-${{ env.PLATFORM_PAIR }}.tar
          # The layers inside are already compressed; zipping them again costs
          # a minute of CPU per leg and saves nothing.
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Upload the test host image
        if: matrix.probe
        uses: actions/upload-artifact@v4
        with:
          name: image-probe
          path: ${{ runner.temp }}/image/scafo-probe.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  test-pure:
    # Lint, typecheck and the pure suites share one runner: as separate jobs
    # they each round their billed minute up, and they want the same install.
    # The container suites ask here whether anything they read changed, for the
    # same reason: they are the expensive half of this workflow and depend on
    # the narrowest slice of the tree, and this job runs on every event anyway,
    # so the answer costs no runner of its own. Everything else stays
    # unconditional: it is cheap and it covers everything.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 15
    outputs:
      # A dispatch is a deliberate "run it all", so it answers before the filter
      # is even consulted.
      docker: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      k3s: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.k3s == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # Ignored on pull_request, where the PR's own base decides; on a push
          # to main it selects the commit that was the tip before the push.
          base: main
          # The default quantifier makes a leading "!" match every other file
          # instead of excluding one, which would leave the docker filter always
          # true. This one is the intended "matches an include and no exclude".
          predicate-quantifier: some-with-excludes
          filters: |
            docker:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'Dockerfile*'
              - '.dockerignore'
              - 'build.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'test/integration/**'
              - '!test/integration/e2e-k3s.test.ts'
              - '!test/integration/store.test.ts'
            k3s:
              - '.github/workflows/ci.yml'
              - 'src/**'
              - 'Dockerfile*'
              - '.dockerignore'
              - 'build.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              - 'examples/k3s/**'
              - 'test/integration/e2e-k3s.test.ts'
              - 'test/integration/_harness.ts'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare development build
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

      - name: Typecheck code
        run: pnpm typecheck

      - name: Test pure code
        run: >-
          pnpm vitest run --config vitest.no-store.config.ts --exclude "test/integration/**" --slowTestThreshold=1000

      - name: Build packages
        run: pnpm build

  test-store-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        store: [seaweedfs, rustfs]

    env:
      SCAFO_TEST_STORE: ${{ matrix.store }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test store compatibility
        run: >-
          pnpm vitest run test/integration/store.test.ts --slowTestThreshold=1000

  test-docker-e2e:
    # Three shards over the images `build-image` produced: only run them when
    # something they read changed. See the `docker` filter for what that means.
    needs: [test-pure, build-image]
    # success() is spelled out because a custom if replaces the implicit one a
    # "needs" would otherwise carry — a failed build must not reach the suites.
    if: ${{ success() && needs.test-pure.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Every shard runs daemons out of the `probe` image; only this one
          # also exercises the product image, so only it loads that archive.
          - shard: product-image
            node-image: scafo-e2e-image
            files: >-
              test/integration/e2e.test.ts test/integration/e2e-image.test.ts
          - shard: traefik-tls
            node-image: ""
            files: >-
              test/integration/e2e-traefik.test.ts test/integration/e2e-tls.test.ts
          - shard: multinode
            node-image: ""
            files: test/integration/e2e-multinode.test.ts

    name: test-docker-e2e (${{ matrix.shard }})

    env:
      SCAFO_E2E: "1"
      # Empty for the shards that never start the product image, which is what
      # tells the suite to build the Dockerfile itself, as a local run does.
      SCAFO_E2E_IMAGE: ${{ matrix.node-image }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Download the test host image
        uses: actions/download-artifact@v4
        with:
          name: image-probe
          path: ${{ runner.temp }}/images

      - name: Download the node image
        if: matrix.node-image != ''
        uses: actions/download-artifact@v4
        with:
          name: image-linux-amd64
          path: ${{ runner.temp }}/images

      - name: Load the images into the daemon
        env:
          IMAGES: ${{ runner.temp }}/images
          NODE_IMAGE: ${{ matrix.node-image }}
        run: |
          set -euo pipefail
          # What arrives is an OCI layout, which `docker load` reads only with
          # the containerd image store this daemon does not use, so skopeo --
          # the tool publish.yml pushes the very same archives with -- rewrites
          # each as the docker archive `docker load` does read. A file rather
          # than skopeo's docker-daemon transport, which negotiates an Engine
          # API version and fails on a daemon newer than it knows.
          load() {
            skopeo copy "oci-archive:$IMAGES/$1" "docker-archive:$IMAGES/load.tar:$2:latest"
            docker load --input "$IMAGES/load.tar"
            rm "$IMAGES/load.tar"
          }
          load scafo-probe.tar scafo-probe
          if [ -n "$NODE_IMAGE" ]; then
            load scafo-linux-amd64.tar "$NODE_IMAGE"
          fi

      - name: Test Docker end to end
        run: >-
          pnpm vitest run --config vitest.no-store.config.ts --no-file-parallelism --slowTestThreshold=1000 ${{ matrix.files }}

  test-k3s-e2e:
    # The most expensive job in the workflow: a K3s cluster around the runtime
    # image this run built. Gated on the same terms, see the `k3s` filter.
    needs: [test-pure, build-image]
    # success() is spelled out because a custom if replaces the implicit one a
    # "needs" would otherwise carry — a failed build must not reach the suite.
    if: ${{ success() && needs.test-pure.outputs.k3s == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    env:
      SCAFO_K3S_E2E: "1"
      SCAFO_E2E_IMAGE: scafo-e2e-k3s

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the node image
        uses: actions/download-artifact@v4
        with:
          name: image-linux-amd64
          path: ${{ runner.temp }}/images

      - name: Load the node image into the daemon
        env:
          IMAGES: ${{ runner.temp }}/images
        run: |
          set -euo pipefail
          # The suite saves this out of the daemon again to import it into the
          # cluster; see the load step in test-docker-e2e for why it arrives
          # through skopeo and a docker archive.
          skopeo copy "oci-archive:$IMAGES/scafo-linux-amd64.tar" \
            "docker-archive:$IMAGES/load.tar:${SCAFO_E2E_IMAGE}:latest"
          docker load --input "$IMAGES/load.tar"
          rm "$IMAGES/load.tar"

      - name: Test K3s end to end
        run: >-
          pnpm vitest run --config vitest.no-store.config.ts test/integration/e2e-k3s.test.ts --slowTestThreshold=1000

  preview:
    # Publish previews only after the same commit passes every CI job, and only
    # for pull requests: a push to main already ships the same tree as :edge.
    permissions:
      contents: read
    needs:
      - build-image
      - test-pure
      - test-store-integration
      - test-docker-e2e
      - test-k3s-e2e
    # A gated job the diff skipped must not take this one down with it, so the
    # implicit success() is spelled out as "nothing above failed or was
    # cancelled" — which a skipped job satisfies.
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare development build
        run: pnpm dev:prepare

      - name: Build packages
        run: pnpm build

      - name: Publish to pkg.pr.new
        run: pnpx pkg-pr-new publish --pnpm

  tags:
    # What this run has earned the right to tag. Kept out of publish.yml so the
    # reusable workflow stays a publisher and not a policy; release.yml asks
    # for its own tags through the same script.
    name: compute tags
    needs:
      - build-image
      - test-pure
      - test-store-integration
      - test-docker-e2e
      - test-k3s-e2e
    # success() is spelled out because a custom if replaces the implicit one a
    # "needs" would otherwise carry — and spelled out per result, because
    # success() is false when a gated job above was skipped by the path filter.
    if: >-
      ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tags: ${{ steps.compute.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image tags
        id: compute
        run: |
          set -euo pipefail
          {
            echo "tags<<TAGS_EOF"
            .github/scripts/image-tags.sh --image "$IMAGE" --sha "$GITHUB_SHA"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    # The edge channel: every commit on main that passed every job above ships
    # as :edge and :sha-<7>, with its binaries kept as run artifacts.
    #
    # The permissions are the union of what publish.yml's jobs ask for, because
    # a called workflow may only narrow the caller's grant. This job runs no
    # steps of its own; each job inside publish.yml declares the narrower set
    # it actually uses.
    name: publish
    needs: [tags, build-image]
    if: success() && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      image-tags: ${{ needs.tags.outputs.image-tags }}
      # What reaches ghcr is what `build-image` produced and every job above
      # tested, pushed by its own digest rather than built a second time.
      image-artifacts: true
