name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Jobs opt in to exactly the scopes they need.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/sandros94/scafo

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare development build
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare development build
        run: pnpm dev:prepare

      - name: Typecheck code
        run: pnpm typecheck

  test-pure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare development build
        run: pnpm dev:prepare

      - name: Test pure code
        run: >-
          pnpm vitest run --config vitest.no-store.config.ts --exclude "test/integration/**" --slowTestThreshold=1000

      - name: Build packages
        run: pnpm build

  test-store-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        store: [seaweedfs, rustfs]

    env:
      SCAFO_TEST_STORE: ${{ matrix.store }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test store compatibility
        run: >-
          pnpm vitest run test/integration/store.test.ts --slowTestThreshold=1000

  test-docker-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: product-image
            files: >-
              test/integration/e2e.test.ts test/integration/e2e-image.test.ts
          - shard: traefik-tls
            files: >-
              test/integration/e2e-traefik.test.ts test/integration/e2e-tls.test.ts
          - shard: multinode
            files: test/integration/e2e-multinode.test.ts

    name: test-docker-e2e (${{ matrix.shard }})

    env:
      SCAFO_E2E: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Build the node host image
        run: docker build --target probe -t scafo-probe .

      - name: Test Docker end to end
        run: >-
          pnpm vitest run --config vitest.no-store.config.ts --no-file-parallelism --slowTestThreshold=1000 ${{ matrix.files }}

  test-k3s-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30

    env:
      SCAFO_K3S_E2E: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test K3s end to end
        run: >-
          pnpm vitest run --config vitest.no-store.config.ts test/integration/e2e-k3s.test.ts --slowTestThreshold=1000

  preview:
    # Publish previews only after the same commit passes every CI job.
    permissions:
      contents: read
    needs:
      - lint
      - typecheck
      - test-pure
      - test-store-integration
      - test-docker-e2e
      - test-k3s-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare development build
        run: pnpm dev:prepare

      - name: Build packages
        run: pnpm build

      - name: Publish to pkg.pr.new
        run: pnpx pkg-pr-new publish --pnpm

  tags:
    # What this run has earned the right to tag. Kept out of publish.yml so the
    # reusable workflow stays a publisher and not a policy; release.yml asks
    # for its own tags through the same script.
    name: compute tags
    needs:
      - lint
      - typecheck
      - test-pure
      - test-store-integration
      - test-docker-e2e
      - test-k3s-e2e
    # success() is spelled out because a custom if replaces the implicit one a
    # "needs" would otherwise carry.
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image-tags: ${{ steps.compute.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Compute image tags
        id: compute
        run: |
          set -euo pipefail
          {
            echo "tags<<TAGS_EOF"
            .github/scripts/image-tags.sh --image "$IMAGE" --sha "$GITHUB_SHA"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  publish:
    # The edge channel: every commit on main that passed every job above ships
    # as :edge and :sha-<7>, with its binaries kept as run artifacts.
    #
    # The permissions are the union of what publish.yml's jobs ask for, because
    # a called workflow may only narrow the caller's grant. This job runs no
    # steps of its own; each job inside publish.yml declares the narrower set
    # it actually uses.
    name: publish
    needs: tags
    if: success() && github.event_name == 'push'
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ github.sha }}
      image-tags: ${{ needs.tags.outputs.image-tags }}
