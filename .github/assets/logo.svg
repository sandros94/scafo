  <title id="title">Scafo — Saffron bow carrying cells</title>
  <desc id="desc">A cropped right-facing saffron ship bow carrying green rounded cells with visible cores. Seven cells sit in tightly packed rows with a half-cell stagger on a level deck, ending where the bow begins to rise. Cargo continues beyond the left edge, above cyan waves and deep blue water.</desc>
