# Disposable two-node fleet; one bucket and prefix define membership.
name: scafo-multi-node

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    command: ["server", "-s3"]
    ports:
      - "127.0.0.1:${SCAFO_STORE_PORT:-8333}:8333"
    volumes:
      - store:/data

  bucket:
    image: curlimages/curl:8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
    depends_on:
      - seaweedfs
    command:
      - sh
      - -c
      - |
        # Accept a pre-existing bucket so repeat starts do not block both nodes.
        until code=$$(curl -sS -o /dev/null -w '%{http_code}' -X PUT http://seaweedfs:8333/scafo)
              [ "$$code" = 200 ] || [ "$$code" = 409 ]
        do sleep 1; done
        echo "bucket \"scafo\": HTTP $$code"

  node-a:
    image: ${SCAFO_IMAGE:-ghcr.io/sandros94/scafo:latest}
    depends_on:
      bucket:
        condition: service_completed_successfully
    # Drain and Celld shutdown require more than Docker's default 10 seconds.
    stop_grace_period: 50s
    ports:
      - "${SCAFO_A_HTTP_PORT:-8081}:80"
      # The node API is local; Caddy shares the node namespace.
      - "127.0.0.1:${SCAFO_A_NODE_PORT:-7401}:7400"
    volumes:
      # Each node needs a distinct persistent keypair and identity.
      - state-a:/var/lib/scafo
      - ingress-log-a:/var/log/scafo-ingress
      - ./scafo.config.jsonc:/etc/scafo/scafo.config.jsonc:ro
    environment:
      SCAFO_S3_ACCESS_KEY: ${SCAFO_S3_ACCESS_KEY:?set SCAFO_S3_ACCESS_KEY in .env}
      SCAFO_S3_SECRET_KEY: ${SCAFO_S3_SECRET_KEY:?set SCAFO_S3_SECRET_KEY in .env}
      # Required by Caddy for both storage and routing; do not default this to empty.
      SCAFO_INGRESS_TOKEN: ${SCAFO_INGRESS_TOKEN:?set SCAFO_INGRESS_TOKEN in .env}
      SCAFO_NODE_ID: node-a
      SCAFO_ADVERTISE: node-a:7400
    command: ["sail", "--config", "/etc/scafo/scafo.config.jsonc"]
    healthcheck:
      # The image's own probe, given the same config file the node boots from:
      # it asks whatever that says the node bound, rather than a fixed address.
      test:
        [
          "CMD",
          "node",
          "/app/dist/cli/index.mjs",
          "health",
          "--config",
          "/etc/scafo/scafo.config.jsonc",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  caddy-a:
    image: ${SCAFO_CADDY_IMAGE:-ghcr.io/sandros94/scafo-caddy:edge}
    # Shared loopback keeps runtime ports private.
    network_mode: "service:node-a"
    depends_on:
      node-a:
        # Caddy reads certificate storage and routing through this node at startup.
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/config.json"]
    environment:
      SCAFO_INGRESS_TOKEN: ${SCAFO_INGRESS_TOKEN:?set SCAFO_INGRESS_TOKEN in .env}
    volumes:
      - ./caddy.json:/etc/caddy/config.json:ro
      - ingress-log-a:/var/log/scafo-ingress
      - caddy-data-a:/data
      - caddy-config-a:/config
    healthcheck:
      # Healthy once the polled routing resolves the platform apex to its node.
      test:
        - CMD
        - wget
        - -q
        - -O-
        - "--header=Host: scafo.test"
        - http://127.0.0.1/.well-known/scafo/health
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  node-b:
    image: ${SCAFO_IMAGE:-ghcr.io/sandros94/scafo:latest}
    depends_on:
      bucket:
        condition: service_completed_successfully
    # Match node A's shutdown grace for coordinated draining.
    stop_grace_period: 50s
    ports:
      - "${SCAFO_B_HTTP_PORT:-8082}:80"
      - "127.0.0.1:${SCAFO_B_NODE_PORT:-7402}:7400"
    volumes:
      # Do not share node A's identity volume.
      - state-b:/var/lib/scafo
      - ingress-log-b:/var/log/scafo-ingress
      - ./scafo.config.jsonc:/etc/scafo/scafo.config.jsonc:ro
    environment:
      SCAFO_S3_ACCESS_KEY: ${SCAFO_S3_ACCESS_KEY:?set SCAFO_S3_ACCESS_KEY in .env}
      SCAFO_S3_SECRET_KEY: ${SCAFO_S3_SECRET_KEY:?set SCAFO_S3_SECRET_KEY in .env}
      SCAFO_INGRESS_TOKEN: ${SCAFO_INGRESS_TOKEN:?set SCAFO_INGRESS_TOKEN in .env}
      SCAFO_NODE_ID: node-b
      SCAFO_ADVERTISE: node-b:7400
    command: ["sail", "--config", "/etc/scafo/scafo.config.jsonc"]
    healthcheck:
      # The image's own probe, given the same config file the node boots from:
      # it asks whatever that says the node bound, rather than a fixed address.
      test:
        [
          "CMD",
          "node",
          "/app/dist/cli/index.mjs",
          "health",
          "--config",
          "/etc/scafo/scafo.config.jsonc",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  caddy-b:
    image: ${SCAFO_CADDY_IMAGE:-ghcr.io/sandros94/scafo-caddy:edge}
    network_mode: "service:node-b"
    depends_on:
      node-b:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/config.json"]
    environment:
      SCAFO_INGRESS_TOKEN: ${SCAFO_INGRESS_TOKEN:?set SCAFO_INGRESS_TOKEN in .env}
    volumes:
      - ./caddy.json:/etc/caddy/config.json:ro
      - ingress-log-b:/var/log/scafo-ingress
      - caddy-data-b:/data
      - caddy-config-b:/config
    healthcheck:
      # Healthy once the polled routing resolves the platform apex to its node.
      test:
        - CMD
        - wget
        - -q
        - -O-
        - "--header=Host: scafo.test"
        - http://127.0.0.1/.well-known/scafo/health
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  cli:
    image: ${SCAFO_IMAGE:-ghcr.io/sandros94/scafo:latest}
    profiles: ["cli"]
    user: "${SCAFO_CLI_USER:-1000:1000}"
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      SCAFO_HOME: /work/.scafo
      SCAFO_S3_ACCESS_KEY: ${SCAFO_S3_ACCESS_KEY:?set SCAFO_S3_ACCESS_KEY in .env}
      SCAFO_S3_SECRET_KEY: ${SCAFO_S3_SECRET_KEY:?set SCAFO_S3_SECRET_KEY in .env}

volumes:
  store:
  state-a:
  state-b:
  ingress-log-a:
  ingress-log-b:
  caddy-data-a:
  caddy-data-b:
  caddy-config-a:
  caddy-config-b:
