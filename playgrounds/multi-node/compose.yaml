# The multi-node playground: one bucket and TWO scafo nodes, each with its own
# ingress. README.md is the step sheet.
#
#   cp .env.example .env
#   docker compose up -d
#
# WHAT MAKES THESE TWO NODES ONE FLEET is that they name the same bucket and the
# same prefix in scafo.config.jsonc. Nothing else. They are never told about each
# other: no seed list, no discovery, no gossip.
#
# `docker compose down -v` removes all of it.

name: scafo-multi-node

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.42
    command: ["server", "-s3"]
    ports:
      - "127.0.0.1:${SCAFO_STORE_PORT:-8333}:8333"
    volumes:
      - store:/data

  # 409 COUNTS AS SUCCESS. Every run after the first finds the bucket already
  # there, and a loop accepting only 2xx spins forever with both nodes stuck
  # behind it and nothing in their logs.
  bucket:
    image: curlimages/curl:8.18.0
    depends_on:
      - seaweedfs
    command:
      - sh
      - -c
      - |
        until code=$$(curl -sS -o /dev/null -w '%{http_code}' -X PUT http://seaweedfs:8333/scafo)
              [ "$$code" = 200 ] || [ "$$code" = 409 ]
        do sleep 1; done
        echo "bucket \"scafo\": HTTP $$code"

  # The two nodes are byte-identical apart from three lines: their id, the
  # address they advertise, and which host ports they publish.
  node-a:
    image: scafo:local
    depends_on:
      bucket:
        condition: service_completed_successfully
    # A ceiling, not a wait: on SIGTERM the node drains before it stops the
    # processes serving traffic. Docker's default ten would cut that off.
    stop_grace_period: 35s
    ports:
      # Caddy shares this container's namespace, so its port is published here.
      - "${SCAFO_A_HTTP_PORT:-8081}:80"
      - "127.0.0.1:${SCAFO_A_AGENT_PORT:-7401}:7400"
    volumes:
      # ITS OWN VOLUME, AND THIS IS NOT OPTIONAL. A node IS its keypair. Two
      # nodes sharing one state volume would come up as the same node, register
      # over each other, and fight for one identity's work.
      - state-a:/var/lib/scafo
      - ingress-log-a:/var/log/scafo-ingress
      - ./scafo.config.jsonc:/etc/scafo/scafo.config.jsonc:ro
    environment:
      SCAFO_S3_ACCESS_KEY: ${SCAFO_S3_ACCESS_KEY:?set SCAFO_S3_ACCESS_KEY in .env}
      SCAFO_S3_SECRET_KEY: ${SCAFO_S3_SECRET_KEY:?set SCAFO_S3_SECRET_KEY in .env}
      # THE `:?` IS LOAD-BEARING: a node given this set to NOTHING refuses to
      # boot, so compose refuses first, naming the file to fix.
      SCAFO_STORAGE_TOKEN: ${SCAFO_STORAGE_TOKEN:?set SCAFO_STORAGE_TOKEN in .env}
      SCAFO_NODE_ID: node-a
      # WHERE THE OTHER NODE DIALS THIS ONE, and the whole of discovery. Getting
      # it wrong is invisible until a durable object is owned across the pair.
      SCAFO_ADVERTISE: node-a:7400
    command: ["up", "--config", "/etc/scafo/scafo.config.jsonc"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7400/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  # SHARES NODE A'S NETWORK NAMESPACE: the runtime processes bind 127.0.0.1 and
  # Caddy dials them there, and the node converges Caddy's admin API on the same
  # loopback. `service_healthy` and not `service_started`, because scafo-caddy
  # fills its certificate cache from storage at boot and storage is that node.
  #
  # `:edge` and not `:latest`: caddy.json passes the token inline, and the v0.1.0
  # module refuses that field outright with `json: unknown field "token"`.
  caddy-a:
    image: ${SCAFO_CADDY_IMAGE:-ghcr.io/sandros94/scafo-caddy:edge}
    network_mode: "service:node-a"
    depends_on:
      node-a:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/config.json"]
    environment:
      SCAFO_STORAGE_TOKEN: ${SCAFO_STORAGE_TOKEN:?set SCAFO_STORAGE_TOKEN in .env}
    volumes:
      - ./caddy.json:/etc/caddy/config.json:ro
      - ingress-log-a:/var/log/scafo-ingress
      - caddy-data-a:/data
      - caddy-config-a:/config
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2019/config/apps/http/servers/scafo/routes"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  node-b:
    image: scafo:local
    depends_on:
      bucket:
        condition: service_completed_successfully
    stop_grace_period: 35s
    ports:
      - "${SCAFO_B_HTTP_PORT:-8082}:80"
      - "127.0.0.1:${SCAFO_B_AGENT_PORT:-7402}:7400"
    volumes:
      - state-b:/var/lib/scafo
      - ingress-log-b:/var/log/scafo-ingress
      - ./scafo.config.jsonc:/etc/scafo/scafo.config.jsonc:ro
    environment:
      SCAFO_S3_ACCESS_KEY: ${SCAFO_S3_ACCESS_KEY:?set SCAFO_S3_ACCESS_KEY in .env}
      SCAFO_S3_SECRET_KEY: ${SCAFO_S3_SECRET_KEY:?set SCAFO_S3_SECRET_KEY in .env}
      SCAFO_STORAGE_TOKEN: ${SCAFO_STORAGE_TOKEN:?set SCAFO_STORAGE_TOKEN in .env}
      SCAFO_NODE_ID: node-b
      SCAFO_ADVERTISE: node-b:7400
    command: ["up", "--config", "/etc/scafo/scafo.config.jsonc"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:7400/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  caddy-b:
    image: ${SCAFO_CADDY_IMAGE:-ghcr.io/sandros94/scafo-caddy:edge}
    network_mode: "service:node-b"
    depends_on:
      node-b:
        condition: service_healthy
    command: ["caddy", "run", "--config", "/etc/caddy/config.json"]
    environment:
      SCAFO_STORAGE_TOKEN: ${SCAFO_STORAGE_TOKEN:?set SCAFO_STORAGE_TOKEN in .env}
    volumes:
      - ./caddy.json:/etc/caddy/config.json:ro
      - ingress-log-b:/var/log/scafo-ingress
      - caddy-data-b:/data
      - caddy-config-b:/config
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:2019/config/apps/http/servers/scafo/routes"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  # The CLI as a one-shot container, for anyone who would rather install no node
  # toolchain: `docker compose run --rm cli <args>`. On this network the nodes
  # answer to their service names, so the fleet is registered at
  # http://node-a:7400 and http://node-b:7400 rather than at 127.0.0.1.
  #
  # `user:` is not glue: the image runs as uid 10001, this directory is yours,
  # and the CLI writes the operator home into it.
  cli:
    image: scafo:local
    profiles: ["cli"]
    user: "${SCAFO_CLI_USER:-1000:1000}"
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      SCAFO_HOME: /work/.scafo
      SCAFO_S3_ACCESS_KEY: ${SCAFO_S3_ACCESS_KEY:?set SCAFO_S3_ACCESS_KEY in .env}
      SCAFO_S3_SECRET_KEY: ${SCAFO_S3_SECRET_KEY:?set SCAFO_S3_SECRET_KEY in .env}

volumes:
  store:
  state-a:
  state-b:
  ingress-log-a:
  ingress-log-b:
  caddy-data-a:
  caddy-data-b:
  caddy-config-a:
  caddy-config-b:
